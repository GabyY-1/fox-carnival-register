<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>The 1v1 Fox Carnival | Inscription</title>
  <link rel="stylesheet" href="/fr/style.css">
  <script src="/js/registration.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="language">
      <button class="language-toggle" type="button" aria-expanded="false" aria-controls="language-menu">
        <img src="/assets/language.svg" alt="" width="18" height="18"><span>FR</span>
      </button>
      <nav class="language-menu" id="language-menu" hidden aria-label="Langue">
        <a href="/en/" lang="en">English</a>
        <a href="/fr/" lang="fr" aria-current="page">Français</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <section class="registration-card" aria-label="Inscription">
      <form id="registration-form">
        <label for="discordUsername">Nom d'utilisateur Discord</label>
        <input id="discordUsername" name="discordUsername" type="text" placeholder="tonpseudo" maxlength="80" autocomplete="off" required>
        <label for="sarUsername">Pseudo SAR</label>
        <input id="sarUsername" name="sarUsername" type="text" placeholder="Ton pseudo en jeu" maxlength="40" required>
        <label for="friendCode">Code ami SAR</label>
        <input id="friendCode" name="friendCode" type="text" placeholder="Ton code ami" maxlength="40" required>
        <label for="platform">Plateforme</label>
        <select id="platform" name="platform" required>
          <option value="" disabled selected>Choisis ta plateforme</option>
          <option value="PC">PC</option><option value="PlayStation">PlayStation</option><option value="Xbox">Xbox</option><option value="Nintendo Switch">Nintendo Switch</option>
        </select>
        <button class="submit-button" type="submit"><span class="button-label">Envoyer l'inscription</span><span aria-hidden="true">↗</span></button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
